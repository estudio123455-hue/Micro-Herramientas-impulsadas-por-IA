<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de uso de AI Tools</title>
  <desc id="desc">Categoría, herramienta, entrada, generación y copia del resultado</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="320" fill="url(#bg)" rx="24"/>
  <text x="48" y="58" fill="#e2e8f0" font-family="Georgia, serif" font-size="28" font-weight="700">Flujo de uso</text>
  <text x="48" y="88" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">De la categoría al resultado en cinco pasos</text>

  <g font-family="Arial, sans-serif">
    <rect x="48" y="130" width="140" height="110" rx="16" fill="#312e81"/>
    <text x="118" y="178" text-anchor="middle" fill="#c7d2fe" font-size="14">1</text>
    <text x="118" y="206" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Categoría</text>

    <path d="M198 185 H230" stroke="#64748b" stroke-width="3"/>
    <polygon points="230,178 246,185 230,192" fill="#64748b"/>

    <rect x="256" y="130" width="140" height="110" rx="16" fill="#1d4ed8"/>
    <text x="326" y="178" text-anchor="middle" fill="#bfdbfe" font-size="14">2</text>
    <text x="326" y="206" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Herramienta</text>

    <path d="M406 185 H438" stroke="#64748b" stroke-width="3"/>
    <polygon points="438,178 454,185 438,192" fill="#64748b"/>

    <rect x="464" y="130" width="140" height="110" rx="16" fill="#0f766e"/>
    <text x="534" y="178" text-anchor="middle" fill="#99f6e4" font-size="14">3</text>
    <text x="534" y="206" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Entrada</text>

    <path d="M614 185 H646" stroke="#64748b" stroke-width="3"/>
    <polygon points="646,178 662,185 646,192" fill="#64748b"/>

    <rect x="672" y="130" width="140" height="110" rx="16" fill="#b45309"/>
    <text x="742" y="178" text-anchor="middle" fill="#fde68a" font-size="14">4</text>
    <text x="742" y="206" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Generar</text>

    <path d="M822 185 H846" stroke="#64748b" stroke-width="3"/>
    <polygon points="846,178 862,185 846,192" fill="#64748b"/>

    <rect x="872" y="150" width="48" height="70" rx="12" fill="#334155"/>
    <text x="896" y="192" text-anchor="middle" fill="#e2e8f0" font-size="13">5</text>
  </g>
</svg>
